name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      # Public client keys only (RLS protects data). Never put service_role here.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://wtgvcdxuxebzgdfrrfbj.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0Z3ZjZHh1eGViemdkZnJyZmJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5NDQxMjEsImV4cCI6MjEwOTUyMDEyMX0.NrljYSNe2IB2qGHe4AGf7GYs6ITipLvukAYWB8mOe68
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
